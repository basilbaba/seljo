<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martial Arts Club</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            padding-top:110px;
            font-family:Arial,sans-serif;
            overflow-x:hidden;
            background:black;
        }

        /* HEADER */

        .header{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:110px;
            padding:15px 40px;
            background:rgba(0,0,0,0.6);
            backdrop-filter:blur(10px);
            display:flex;
            justify-content:space-between;
            align-items:center;
            z-index:1000;
        }

        /* LOGO */

        .logo img{
            height:75px;
            width:auto;
            display:block;
        }

        /* NAVBAR */

        .navbar{
            display:flex;
            align-items:center;
            gap:35px;
        }

        .navbar a{
            position:relative;
            font-size:18px;
            color:red;
            font-weight:600;
            text-decoration:none;
            transition:0.3s;
        }

        .navbar a:hover{
            color:white;
        }

        .navbar a::before{
            content:'';
            position:absolute;
            bottom:-6px;
            left:0;
            width:0%;
            height:2px;
            background:white;
            transition:0.4s;
        }

        .navbar a:hover::before{
            width:100%;
        }

        /* MOBILE MENU BUTTON */

        .menu-btn{
            display:none;
            font-size:32px;
            color:white;
            cursor:pointer;
        }

        /* MOBILE RESPONSIVE */

        @media(max-width:768px){

            body{
                padding-top:90px;
            }

            .header{
                height:90px;
                padding:15px 20px;
            }

            .logo img{
                height:60px;
            }

            .menu-btn{
                display:block;
            }

            .navbar{
                position:absolute;
                top:90px;
                left:0;
                width:100%;
                background:black;
                flex-direction:column;
                align-items:center;
                gap:25px;
                padding:30px 0;
                display:none;
                border-top:1px solid #222;
            }

            .navbar.active{
                display:flex;
            }

            .navbar a{
                font-size:18px;
                margin:0;
            }

        }

    </style>
</head>

<body>

<section>

    <header class="header">

        <!-- LOGO -->

        <a href="/">
            <div class="logo">
                <img src="../static/Artboard 1.png" alt="Club Logo">
            </div>
        </a>

        <!-- MOBILE BUTTON -->

        <div class="menu-btn" id="menuBtn">
            ☰
        </div>

        <!-- NAVBAR -->

        <nav class="navbar" id="navbar">
            <a href="#hero">Home</a>
            <a href="#about">About</a>
            <a href="#gallery">Gallery</a>
            <a href="#training">Training</a>
            <a href="#contact">Contact</a>
        </nav>

    </header>

</section>

<script>

const menuBtn = document.getElementById("menuBtn");
const navbar = document.getElementById("navbar");

menuBtn.addEventListener("click", () => {
    navbar.classList.toggle("active");
});

</script>

</body>
</html>
