<section id="gallery">

    <div class="gallery-section">

        <h1 class="gallery-title">
            OUR GALLERY
        </h1>

        <p class="gallery-subtitle">
            Training Moments & Club Activities
        </p>

        <div class="gallery-container">

            {% for row in gallery %}

            <!-- GALLERY CARD -->

            <div class="gallery-card">

                <img
                src="{{ row['photo'] }}"
                alt="{{ row['titile'] }}"
                >

                <div class="gallery-overlay">

                    <h3>
                        {{ row['titile'] }}
                    </h3>

                    {% if row['P_dis'] %}

                    <p>
                        {{ row['P_dis'] }}
                    </p>

                    {% endif %}

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</section>

<style>
.client-gallery {
    width: 100%;
    padding: 60px 8%;
    background: #f5f5f5;
    box-sizing: border-box;
}

.client-gallery h2 {
    text-align: center;
    font-size: 40px;
    margin-bottom: 40px;
    color: #222;
}

.gallery-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
}

.gallery-card {
    background: #fff;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.gallery-card:hover {
    transform: translateY(-10px);
}

.gallery-card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.gallery-content {
    padding: 20px;
}

.gallery-content h3 {
    margin: 0 0 10px;
    font-size: 24px;
    color: #111;
}

.gallery-content p {
    color: #555;
    font-size: 15px;
    line-height: 1.6;
}
</style>
